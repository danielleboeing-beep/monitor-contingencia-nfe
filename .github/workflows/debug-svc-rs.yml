name: Debug SVC-RS (temporario)

on:
  workflow_dispatch: {}   # só roda quando você clicar em "Run workflow"

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Instalar dependencias
        run: pip install requests

      - name: Baixar HTML real da pagina SVC-RS
        run: python debug_svc_rs.py

      - name: Publicar como artefato pra download
        uses: actions/upload-artifact@v4
        with:
          name: debug-svc-rs
          path: debug_svc_rs.html

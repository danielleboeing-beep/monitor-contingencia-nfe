name: Monitor Contingencia NF-e

on:
  schedule:
    # Minimo permitido pelo GitHub Actions: 5 em 5 minutos.
    # Cada execucao faz 2 checagens (intervalo de 2min30s).
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

concurrency:
  group: monitor-contingencia
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  checar:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Instalar dependencias
        run: pip install requests beautifulsoup4

      - name: Rodar monitor
        env:
          TZ: America/Sao_Paulo   # horarios "agora" no fuso de Brasilia
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_URL_COMUNICADO: ${{ secrets.SLACK_WEBHOOK_URL_COMUNICADO }}
        run: python monitor.py

      - name: Salvar estado no repositorio (se mudou)
        run: |
          set -e
          git config user.name "monitor-contingencia-bot"
          git config user.email "actions@users.noreply.github.com"

          git add state.json
          if git diff --staged --quiet; then
            echo "Nada mudou, nada a comitar."
            exit 0
          fi
          git commit -m "chore: atualiza estado [skip ci]"

          for i in 1 2 3 4 5; do
            if git push; then
              echo "Push OK."
              exit 0
            fi
            echo "Push falhou, tentativa $i - sincronizando..."
            git pull --rebase -X ours origin main
          done

          echo "Nao foi possivel subir apos 5 tentativas."
          exit 1

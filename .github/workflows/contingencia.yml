name: Monitor Contingencia NF-e

on:
  schedule:
    # Minimo permitido pelo GitHub Actions: 5 em 5 minutos.
    - cron: "*/5 * * * *"
  workflow_dispatch: {}   # permite rodar manualmente na aba "Actions" pra testar

# Evita que duas execucoes rodem ao mesmo tempo.
concurrency:
  group: monitor-contingencia
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  checar:
    runs-on: ubuntu-latest
    timeout-minutes: 8   # nunca deixa a execucao passar de 8 minutos, mesmo travada
    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Instalar dependencias
        run: pip install requests beautifulsoup4

      - name: Rodar monitor (2 checagens, ~2min30s de intervalo)
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: python monitor.py

      - name: Gerar painel (docs/index.html)
        run: python generate_dashboard.py

      - name: Salvar estado e painel no repositorio (se mudou)
        run: |
          set -e
          git config user.name "monitor-contingencia-bot"
          git config user.email "actions@users.noreply.github.com"

          git add state.json docs/index.html
          if git diff --staged --quiet; then
            echo "Nada mudou, nada a comitar."
            exit 0
          fi
          git commit -m "chore: atualiza estado e painel [skip ci]"

          # Tenta subir; se alguem comitou antes, resolve preferindo a
          # versao que acabamos de calcular (-X ours), que e sempre a
          # leitura mais recente do site - nunca deixa marcador de
          # conflito sobrar no arquivo.
          for i in 1 2 3 4 5; do
            if git push; then
              echo "Push OK."
              exit 0
            fi
            echo "Push falhou, tentativa $i - sincronizando..."
            git pull --rebase -X ours origin main
          done

          echo "Nao foi possivel subir apos 5 tentativas."
          exit 1

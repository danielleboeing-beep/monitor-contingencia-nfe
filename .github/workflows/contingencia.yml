name: Monitor Contingencia NF-e

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

concurrency:
  group: monitor-contingencia
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  checar:
    runs-on: ubuntu-latest   # de volta pra nuvem - o bug real era a regex, nao a rede
    timeout-minutes: 8       # rede de seguranca, continua valendo
    steps:
      - name: Checkout do repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Instalar dependencias
        run: pip install requests beautifulsoup4

      - name: Rodar monitor (2 checagens, ~2min30s de intervalo)
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: python monitor.py

      - name: Salvar estado no repositorio (se mudou)
        run: |
          set -e
          git config user.name "monitor-contingencia-bot"
          git config user.email "actions@users.noreply.github.com"

          git add state.json
          if git diff --staged --quiet; then
            echo "Nada mudou, nada a comitar."
            exit 0
          fi
          git commit -m "chore: atualiza estado [skip ci]"

          for i in 1 2 3 4 5; do
            if git push; then
              echo "Push OK."
              exit 0
            fi
            echo "Push falhou, tentativa $i - sincronizando..."
            git pull --rebase -X ours origin main
          done

          echo "Nao foi possivel subir apos 5 tentativas."
          exit 1
